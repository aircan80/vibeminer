<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeMiner · Desktop Home</title>
<link rel="icon" type="image/svg+xml" href="../../../branding/vibeminer.svg">
<style>
/* Tokens, type scale and chrome come from ../desktop-discovery/. Type scale: 11 / 13 / 14 / 19px at 100%. */
:root{--bg:#f5f3ed;--paper:#fffefa;--ink:#243b3a;--muted:#586a64;--line:#dce2d9;--line-soft:#e9ece5;--teal:#176e66;--mint:#e4f1e9;--hover:#eef4ef;--pill:#b9d5c8;--gold-ink:#7d561b;--gold-line:#e4cfa5;--gold-bg:#fbf5e8;--warn-bg:#fbf3e4;--warn-line:#e7c98f;--err-bg:#fbeeea;--err-line:#e3b5a8;--focus:#e6ad46;--toolbar:#fbfaf6;--status:#eceae2;--side:#f9f8f3;
  --fs-s:.786rem;--fs-m:.929rem;--fs-l:1.357rem;--pane-head:3.43rem;--thead:2rem;--side-w:clamp(18rem,26.5rem,40%);--insp-w:clamp(18rem,24.3rem,34%);--title-row:2.6rem;--panel-w:var(--side-w);font-size:14px}
.app[data-area="tables"]{--panel-w:var(--insp-w)}
:root[data-text="200"]{font-size:28px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:ui-monospace,monospace}
.selectable{user-select:text;-webkit-user-select:text;cursor:text}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.5rem;top:-3rem;z-index:20;background:var(--paper);padding:.3rem .6rem;border-radius:6px}
.skip:focus{top:.5rem}
.dim{color:var(--muted)}
.spacer{flex:1}

/* Window: fixed chrome, only panes scroll. */
.app{height:100vh;container:window/inline-size;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* Build header: one row. Identity fields are a strip of small label over value. */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.43rem .86rem;padding:.43rem .86rem 0;background:var(--toolbar);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.214rem;letter-spacing:-.01em;white-space:nowrap;flex:none}
.brand img{width:2rem;height:2rem;display:block;flex:none}
.brand .word span{color:var(--teal)}
.divider{width:1px;align-self:stretch;background:var(--line);margin:.15rem 0;flex:none}
.idfields{display:flex;align-items:center;gap:.4rem 1.15rem;margin:0;min-width:0;flex-wrap:wrap}
.idf{display:flex;flex-direction:column;min-width:0}
.idf dt{font-size:var(--fs-s);color:var(--muted);font-weight:600;line-height:1.25;white-space:nowrap}
.idf dd{margin:0;font-weight:600;line-height:1.35;white-space:nowrap;height:1.4rem;display:flex;align-items:center}
.idf .pid{font-family:ui-monospace,monospace;font-size:var(--fs-m);color:var(--muted);font-weight:400}
.vbtn{display:inline-flex;align-items:center;gap:.3rem;border:0;background:none;padding:0 .3rem;margin:0 -.3rem;border-radius:4px;font-weight:600;cursor:pointer;line-height:inherit}
.vbtn:hover{background:var(--hover)}
.vbtn[aria-expanded="true"]{background:var(--mint);color:var(--teal)}
.vbtn .chev{font-size:var(--fs-s);color:var(--muted);font-weight:400}
.hgroup{display:flex;align-items:center;gap:.86rem;margin-left:auto;flex:none;min-height:2.3rem}
.btn{height:2.15rem;display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 .8rem;cursor:pointer;white-space:nowrap;flex:none}
.btn:hover:not(:disabled){background:var(--hover);border-color:#c5d3cb}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.btn.primary:hover:not(:disabled){background:#125b54}
.btn.small{height:1.9rem;font-size:var(--fs-m);padding:0 .65rem}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:default}
/* Download mode: a labelled switch in the identity strip. */
.switch{display:inline-flex;align-items:center;gap:.45rem;border:0;background:none;padding:0 .3rem;margin:0 -.3rem;border-radius:4px;font-weight:600;cursor:pointer;line-height:inherit;white-space:nowrap}
.switch:hover{background:var(--hover)}
.switch .track{position:relative;width:1.85rem;height:1.05rem;border-radius:999px;background:#c9d2cc;flex:none}
.switch .track::after{content:"";position:absolute;top:.15rem;left:.15rem;width:.75rem;height:.75rem;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"] .track{background:var(--teal)}
.switch[aria-checked="true"] .track::after{left:auto;right:.15rem}
.activity-chip{display:inline-flex;align-items:center;gap:.5rem;height:2.15rem;padding:0 .75rem;border:1px solid var(--pill);border-radius:6px;background:var(--mint);color:var(--teal);font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip-short{display:none}
.activity-chip .count{min-width:1.3rem;height:1.3rem;border-radius:999px;background:var(--teal);color:#fff;font-size:var(--fs-s);display:grid;place-items:center;padding:0 .3rem}
.activity-chip.attention{border-color:var(--warn-line);background:var(--warn-bg);color:var(--gold-ink)}
.activity-chip.attention .count{background:var(--gold-ink)}
.activity-chip[aria-expanded="true"]{box-shadow:inset 0 0 0 1px currentColor}
.pulse{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* Area navigation: directly under the header. */
.areas{order:9;flex:1 1 100%;display:flex;align-items:stretch;gap:.2rem;height:2.45rem;margin:0 -.86rem;padding:0 .5rem;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.area-group{display:flex;align-items:stretch;gap:.2rem}
.area-sep{align-self:center;width:1px;height:1.3rem;background:var(--line);margin:0 .45rem;flex:none}
.areas button{border:0;background:none;padding:0 .75rem;font-size:var(--fs-m);font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -3px 0 transparent}
.areas button:hover{color:var(--ink);background:var(--hover)}
.areas button[aria-current="page"]{color:var(--teal);font-weight:700;box-shadow:inset 0 -3px 0 var(--teal)}
.areas button:focus-visible{outline-offset:-3px}

/* Shared pane parts */
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--paper);overflow:auto}
.pane>*{flex:none}
.pane>.grid-scroll,.pane>.cat-list,.pane>.pane-scroll{flex:1 1 auto;min-height:6rem}
.pane-head{display:flex;align-items:center;gap:.6rem;min-height:var(--pane-head);padding:.43rem .86rem;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg)}
.pane-head h1,.pane-head h2{font-size:1rem;margin:0 .3rem 0 0;font-weight:700;white-space:nowrap}
.pane-head .n{color:var(--muted);font-weight:400;margin-left:.3rem}
.pane-head .sub{font-size:var(--fs-m);color:var(--muted);min-width:0}
.label{font-size:var(--fs-s);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.control{height:2.15rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 .65rem;min-width:0}
.segmented{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);flex:none}
.segmented button{border:0;background:none;height:2.05rem;padding:0 .75rem;cursor:pointer;white-space:nowrap}
.segmented button+button{border-left:1px solid var(--line)}
.segmented button[aria-pressed="true"]{background:var(--mint);color:var(--teal);font-weight:600}
.pill{display:inline-block;padding:0 .4rem;border-radius:4px;border:1px solid var(--pill);background:var(--paper);color:var(--teal);font-size:var(--fs-s);font-weight:600;line-height:1.5;white-space:nowrap}
.pill.gold{border-color:var(--gold-line);background:var(--gold-bg);color:var(--gold-ink)}
.notice{margin:.6rem .86rem 0;padding:.55rem .75rem;border-radius:6px;border:1px solid var(--warn-line);background:var(--warn-bg);font-size:var(--fs-m);display:flex;gap:.8rem;align-items:flex-start}
.notice.error{border-color:var(--err-line);background:var(--err-bg)}
.notice.calm{border-color:var(--line);background:var(--bg)}
.notice .text{flex:1;min-width:0}
.notice strong{display:block}
.notice code{font-size:var(--fs-s)}
.notice .btn{height:1.9rem}
.state-box{border:1px solid #cfe2d6;background:var(--mint);border-radius:6px;padding:.55rem .7rem;font-size:var(--fs-m)}
.state-box.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.state-box.plain{border-color:var(--line);background:var(--bg)}
.state-box strong{display:block}
.state-box p{margin:.15rem 0 0}
.state-box .row{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap}
.state-box code{font-size:var(--fs-s)}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35rem .9rem;margin:0;font-size:var(--fs-m)}
dl.facts dt{color:var(--muted);white-space:nowrap}
dl.facts dd{margin:0;overflow-wrap:anywhere}
dl.facts dd.mono{font-size:var(--fs-s);line-height:1.7}
.ok{color:var(--teal);font-weight:600}
.warn-t{color:var(--gold-ink);font-weight:600}
.reason{margin:0;font-size:var(--fs-s);color:var(--muted)}
.tiny{font-size:var(--fs-s);color:var(--muted);margin:.6rem 0 0}

/* Home: tiled panels with 1px splits, like a desktop overview. The side panel matches the Discovery inspector. */
.home{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) var(--side-w);grid-template-rows:auto minmax(0,1fr);gap:1px;background:var(--line);min-height:0}
.panel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0;background:var(--paper)}
.panel.side{grid-column:3;grid-row:1/3;background:var(--side)}
.panel.wide{grid-column:1/3}
.panel-head{display:flex;align-items:baseline;gap:.6rem;padding:.6rem 1rem .45rem;flex-wrap:wrap}
.panel-head h2{margin:0;font-size:1rem;font-weight:700;white-space:nowrap}
.panel-head .scope{margin-left:auto;font-size:var(--fs-s);color:var(--muted)}
.panel-body{overflow:auto;padding:.15rem 1rem .8rem;min-height:0}
.panel-foot{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;padding:.55rem 1rem;border-top:1px solid var(--line-soft)}
.panel.side .panel-foot{border-top-color:var(--line);background:var(--paper)}
.panel.side .panel-foot .btn{flex:1;justify-content:center}
.panel.side .panel-foot .reason{flex:1 1 100%}
.metric{display:flex;flex-direction:column;margin-bottom:.7rem}
.metric .mlabel{font-size:var(--fs-m);color:var(--muted)}
.metric strong{font-size:var(--fs-l);line-height:1.3;font-variant-numeric:tabular-nums}
.metric strong.unknown{color:var(--muted)}
.metric .exact{font-size:var(--fs-s);color:var(--muted)}
.loading-line{display:flex;align-items:center;gap:.5rem;color:var(--teal);font-weight:600;font-size:var(--fs-m)}
/* Local storage */
.stack{display:flex;height:.6rem;border-radius:999px;background:var(--line-soft);overflow:hidden;margin:.3rem 0 .45rem}
.stack i{display:block;height:100%}
.stack .own{background:var(--teal)}
.stack .shared{background:#7fb3a3}
.legend{display:flex;flex-wrap:wrap;gap:.25rem 1rem;font-size:var(--fs-s);color:var(--muted);margin-bottom:.4rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.legend i{width:.6rem;height:.6rem;border-radius:2px;background:var(--line-soft);border:1px solid var(--line)}
.legend i.own{background:var(--teal);border-color:var(--teal)}
.legend i.shared{background:#7fb3a3;border-color:#7fb3a3}
.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto auto;font-size:var(--fs-m);margin:0}
.ledger>div{display:contents}
.ledger dt,.ledger dd{padding:.42rem 0;border-bottom:1px solid var(--line-soft);margin:0}
.ledger dt{color:var(--ink);min-width:0}
.ledger dd{padding-left:1.2rem;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger dd.exact{font-weight:400;color:var(--muted);font-family:ui-monospace,monospace;font-size:var(--fs-s)}
.storage-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(15rem,1fr);gap:1.2rem;align-items:start}

/* Tables workbench: catalogue | records | inspector */
.tables{display:grid;grid-template-columns:17rem minmax(0,1fr) var(--insp-w);grid-template-rows:minmax(0,1fr);gap:1px;background:var(--line);min-height:0}
.pane-switch{display:none}
.catalog{background:var(--side)}
.catalog .pane-head{flex-wrap:nowrap}
.catalog .pane-head .search{flex:1;width:100%}
.cat-list{flex:1;overflow:auto;min-height:0;padding:.3rem 0}
.tableitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.55rem;align-items:start;width:100%;border:0;background:none;text-align:left;padding:.42rem .86rem;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.tableitem:hover{background:var(--hover)}
.tableitem[aria-pressed="true"]{background:var(--mint);box-shadow:inset 3px 0 0 var(--teal)}
.tableitem:focus-visible{outline-offset:-3px}
.tableitem .glyph{color:var(--teal);line-height:1.45}
.tableitem b{display:block;font-weight:600;overflow-wrap:normal;word-break:normal}
.tableitem small{display:block;font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-foot{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;padding:.5rem .86rem;border-top:1px solid var(--line);background:var(--paper);font-size:var(--fs-s);color:var(--muted)}
.pane-foot .btn{height:1.75rem;font-size:var(--fs-s);padding:0 .55rem}
.catalog .pane-foot .count{flex:1 1 100%}
.records .pane-head{row-gap:.35rem}
.trail{display:flex;align-items:center;gap:.25rem;min-width:0}
.trail .nav{width:2rem;padding:0;justify-content:center}
.crumb{border:0;background:none;padding:.15rem .4rem;border-radius:4px;cursor:pointer;color:var(--muted);white-space:nowrap}
.crumb[aria-current="step"]{background:var(--mint);color:var(--teal);font-weight:600}
.crumb-sep{color:var(--muted);font-size:var(--fs-s)}
.titlerow{display:flex;align-items:center;gap:.6rem;min-height:var(--title-row);padding:.45rem .86rem;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--paper)}
.titlerow h2{margin:0;font-size:var(--fs-l);line-height:1.25}
.titlerow .meta{font-size:var(--fs-m);color:var(--muted);min-width:0}
.idfilter{display:flex;align-items:center;gap:.4rem}
.idfilter label{font-size:var(--fs-m);color:var(--muted);white-space:nowrap}
.idfilter input{width:7.5rem}
.idfilter .btn{height:2.15rem}
.grid-scroll{flex:1;overflow:auto;min-height:0;position:relative}
.grid-scroll:focus-visible{outline-offset:-3px}
table.records-grid{border-collapse:separate;border-spacing:0;min-width:100%;font-size:var(--fs-m);font-variant-numeric:tabular-nums}
.records-grid th{position:sticky;top:0;z-index:1;background:var(--toolbar);border-bottom:1px solid var(--line);text-align:left;padding:.35rem .75rem;font-size:var(--fs-s);font-weight:600;white-space:nowrap;vertical-align:bottom}
.records-grid th small{display:block;font-weight:400;color:var(--muted)}
.records-grid td{padding:0 .75rem;height:2.3rem;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.records-grid tbody tr{cursor:default}
.records-grid tbody tr:hover{background:var(--hover)}
.records-grid tbody tr[aria-selected="true"]{background:var(--mint)}
.records-grid tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.records-grid .rowsel{border:0;background:none;padding:0;font-weight:600;cursor:pointer}
.records-grid td.zero{color:var(--muted)}
.local-wait{margin:1rem .86rem;max-width:34rem}
.inspector{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;background:var(--side);overflow:auto}
.insp-head{padding:.55rem 1rem;border-bottom:1px solid var(--line);min-height:calc(var(--pane-head) + var(--title-row));display:flex;flex-direction:column;justify-content:center}
.insp-head h2{margin:0;font-size:var(--fs-l);font-weight:700;line-height:1.25}
.insp-head p{margin:0;color:var(--muted);font-size:var(--fs-m)}
.insp-body{overflow:auto;padding:.7rem 1rem;min-height:0}
.insp-body .label{margin:1rem 0 .4rem}
.insp-body .label:first-child{margin-top:0}
.fieldrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--line-soft);font-size:var(--fs-m)}
.fieldrow .fname{color:var(--muted)}
.fieldrow .ftype{font-size:var(--fs-s);color:var(--muted);font-family:ui-monospace,monospace;text-align:right}
.fieldrow .fval{grid-column:1/-1;font-weight:600;font-size:1rem}
.fieldrow .rel{grid-column:1/-1;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:var(--fs-s);color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--teal);text-decoration:underline;cursor:pointer;font-size:var(--fs-s)}
.insp-foot{padding:.6rem 1rem;border-top:1px solid var(--line);background:var(--paper);display:flex;gap:.55rem;flex-wrap:wrap}
.insp-foot .btn{flex:1;justify-content:center}
.placeholder{display:grid;place-items:center;text-align:center;color:var(--muted);padding:2rem;background:var(--paper)}
.placeholder div{border:1px dashed var(--line);border-radius:6px;padding:1.2rem 1.6rem;max-width:30rem}
.placeholder h1{font-size:1rem;color:var(--ink);margin:0 0 .3rem}
.placeholder p{margin:0;font-size:var(--fs-m)}
.placeholder .btn{margin-top:.8rem}
.return-link{flex:none}
.titlerow .return-link{height:1.7rem}
.trail-sep{width:1px;height:1.3rem;background:var(--line);margin:0 .35rem;flex:none}
.cdn-note{margin:.7rem 0 0;padding:.5rem .65rem;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:6px;font-size:var(--fs-m)}
.cdn-note code{font-size:var(--fs-s)}

/* Activity panel: nonmodal, follows the chip in DOM order, covers exactly the side column (Home) or inspector (Tables) below the header. Whatever it covers is inert. */
.activity-panel{position:fixed;right:0;width:var(--panel-w);background:var(--paper);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(36,59,58,.08);display:flex;flex-direction:column;z-index:3;white-space:normal;font-weight:400;color:var(--ink);text-align:left}
.activity-panel header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.activity-panel h2{margin:0;font-size:1rem}
.activity-panel .rows{overflow:auto;padding:.4rem 1rem .8rem;flex:1}
.activity-panel .label{margin:.6rem 0 .4rem}
.task{border:1px solid var(--line);border-radius:6px;padding:.6rem .7rem;margin-bottom:.6rem;font-size:var(--fs-m)}
.task.failed{border-color:var(--err-line);background:var(--err-bg)}
.task .t{font-weight:600}
.task .s{color:var(--muted)}
.task code{font-size:var(--fs-s)}
.bar{height:.36rem;background:var(--line-soft);border-radius:999px;margin:.45rem 0 .3rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.bar.indeterminate i{width:30%;animation:slide 1.8s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar.indeterminate i{animation:none;width:100%;opacity:.35}}
.task .row{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap}
.task .btn{height:1.9rem;font-size:var(--fs-m)}

/* Identity and Status popovers: nonmodal dialogs placed right after their trigger in the DOM, one surface at a time. */
.popover{position:fixed;z-index:4;white-space:normal;font-weight:400;line-height:1.45;color:var(--ink);width:min(25rem,calc(100vw - 1rem));background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(36,59,58,.16);display:flex;flex-direction:column;overflow:hidden}
.popover header{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .9rem;border-bottom:1px solid var(--line)}
.popover h2{margin:0;font-size:1rem}
.popover .pop-body{overflow:auto;padding:.7rem .9rem .8rem}
.popover .tiny{margin-top:.7rem}
.popover dl.facts{grid-template-columns:minmax(0,1fr);gap:0}
.popover dl.facts dt{font-size:var(--fs-s);white-space:normal;margin-top:.45rem}
.popover dl.facts dt:first-child{margin-top:0}
.popover dl.facts dd{font-weight:600}
.popover dl.facts dd.mono{font-weight:400}
.popover .row{margin-top:.7rem}

/* Status bar: always one line. */
.statusbar{display:flex;align-items:center;gap:1.1rem;height:1.75rem;padding:0 .86rem;background:var(--status);border-top:1px solid var(--line);font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden}
.statusbar strong{color:var(--ink);font-weight:600}
.statusbar .busy{display:inline-flex;align-items:center;gap:.4rem;color:var(--teal);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.statusbar .warn{color:var(--gold-ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}

/* Tables: reference cells, sticky ID column, structure and relationships. */
.records-grid th:first-child,.records-grid td:first-child{position:sticky;left:0;z-index:1;background:var(--paper);box-shadow:inset -1px 0 0 var(--line-soft)}
.records-grid th:first-child{z-index:2;background:var(--toolbar)}
.records-grid tbody tr:hover td:first-child{background:var(--hover)}
.records-grid tbody tr[aria-selected="true"] td:first-child{background:var(--mint);box-shadow:inset 3px 0 0 var(--teal),inset -1px 0 0 var(--line-soft)}
.records-grid td.refcell{cursor:pointer}
.ref{color:var(--teal);font-weight:600;text-decoration:underline dotted;text-underline-offset:3px}
.refcell:hover .ref{text-decoration-style:solid}
.rt{color:var(--muted);font-weight:400}
.rt.pending{letter-spacing:.08em}
.records-grid td.txt{white-space:nowrap}
.records-grid .unv,.unv{color:var(--gold-ink);font-weight:700;margin-left:.1rem}
.records-grid.struct td{height:2.2rem}
.records-grid.struct td:first-child{min-width:2.2rem}
.subbar{display:flex;align-items:center;gap:.4rem .7rem;flex-wrap:wrap;padding:.4rem .86rem;border-bottom:1px solid var(--line-soft);font-size:var(--fs-m);color:var(--muted);background:var(--paper)}
.subbar .ink{color:var(--ink)}
.chip-filter{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--pill);background:var(--mint);color:var(--teal);border-radius:999px;padding:0 .2rem 0 .6rem;font-weight:600;white-space:nowrap}
.chip-x{border:0;background:none;color:inherit;cursor:pointer;width:1.4rem;height:1.4rem;border-radius:50%;padding:0}
.chip-x:hover{background:#d5eadf}
.records>.notice{margin-bottom:.6rem}
.rel-list{overflow:auto;padding:.3rem .86rem 1rem}
.rel-list .label{margin:.9rem 0 .4rem}
.relcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .8rem;align-items:center;border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem;margin-bottom:.45rem;background:var(--paper)}
.relcard.current{background:var(--mint);box-shadow:inset 3px 0 0 var(--teal)}
.relcard b{font-weight:600;font-size:var(--fs-m);overflow-wrap:anywhere}
.relcard .st{grid-column:1;font-size:var(--fs-s);color:var(--muted)}
.relcard .act{grid-column:2;grid-row:1/3}
.relcard code{font-size:var(--fs-s)}
.fieldrow .fmeta{grid-column:1/-1;font-size:var(--fs-s);color:var(--muted)}
.fieldrow .rtext{grid-column:1/-1;font-size:var(--fs-m);margin-top:.1rem}
.fieldrow .rtext .dim{font-size:var(--fs-s)}
/* Files: filter row, membership list (listbox), file inspector. */
.app[data-area="files"]{--panel-w:var(--insp-w)}
.files{display:grid;grid-template-columns:minmax(0,1fr) var(--insp-w);grid-template-rows:minmax(0,1fr);gap:1px;background:var(--line);min-height:0}
.files-filters{flex-wrap:nowrap}
.files-filters .fsearch{width:12.5rem;flex:0 1 12.5rem}
.files-filters select{flex:0 1 auto;min-width:0}
.fbtn{display:none}
.fbtn .fcount{min-width:1.3rem;height:1.3rem;border-radius:999px;background:var(--teal);color:#fff;font-size:var(--fs-s);display:grid;place-items:center;padding:0 .3rem;font-weight:600}
.fbtn .chev{font-size:var(--fs-s);color:var(--muted)}
.fbtn[aria-expanded="true"]{background:var(--mint);border-color:var(--pill);color:var(--teal)}
.fextra{display:contents}
.check{display:inline-flex;align-items:center;gap:.35rem;font-size:var(--fs-m);white-space:nowrap}
.check input{width:1rem;height:1rem;margin:0;accent-color:var(--teal)}
.list-scroll{position:relative;flex:1 1 auto;overflow:auto;min-height:6rem;background:var(--paper);scroll-padding-top:var(--thead)}
.fcols{display:grid;grid-template-columns:6.5rem minmax(9rem,2.2fr) 6.5rem minmax(6.5rem,1.1fr) minmax(5.5rem,.9fr) 6.5rem;align-items:center;column-gap:.86rem;padding:0 .86rem}
.fthead{position:sticky;top:0;z-index:1;height:var(--thead);background:var(--toolbar);border-bottom:1px solid var(--line);font-size:var(--fs-s);font-weight:600;color:var(--muted);white-space:nowrap}
[role="listbox"]:focus-visible{outline:none}
.files [role="option"]{position:relative;min-height:2.45rem;border-bottom:1px solid var(--line-soft);font-size:var(--fs-m);white-space:nowrap;cursor:default}
.files [role="option"]>span{overflow:hidden;text-overflow:ellipsis}
.files [role="option"]:hover{background:var(--hover)}
.files [role="option"][aria-selected="true"]{background:var(--mint);box-shadow:inset 3px 0 0 var(--teal)}
[role="listbox"]:focus-visible [role="option"].active{outline:3px solid var(--focus);outline-offset:-3px}
.fid{font-weight:600;font-variant-numeric:tabular-nums}
.fname-cell .mono{font-size:var(--fs-s)}
.files [role="option"]>span.fname-cell{white-space:normal;overflow-wrap:anywhere;overflow:visible;padding:.3rem 0}
.pill.community{border-color:#c9cfdc;background:#f3f4f8;color:#4a5670;margin-left:.4rem}
.files .insp-head{min-height:calc(var(--pane-head) + var(--thead))}
.member{border:1px solid var(--line);border-radius:6px;padding:.5rem .65rem;margin-top:.6rem;background:var(--paper)}
.member.current{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.member dl.facts{font-size:var(--fs-s)}
.member dl.facts dd.mono{font-size:var(--fs-s)}

/* Medium window: the activity entry uses its short label. */
@container window (max-width:84rem){
  .chip-long{display:none}
  .chip-short{display:inline}
  .storage-cols{grid-template-columns:minmax(0,1fr)}
}
/* Enlarged text or narrow window (like .dv-compact): the header wraps to a second row, panes stack, the window still never scrolls. */
@container window (max-width:70rem){
  /* Row 1: logo and identity, with Product and Build named by their buttons, Source and Locale moved to the status bar.
     Row 2: area bar, then the activity entry and Choose build. */
  .toolbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand ids ids" "areas areas actions";column-gap:.7rem}
  .brand{grid-area:brand}
  .idfields{grid-area:ids}
  .brand .word,.toolbar .divider{display:none}
  .idfields{gap:.3rem .9rem}
  .idf{flex-direction:row;align-items:center;gap:.35rem}
  .idf dt{font-size:var(--fs-m)}
  .idf.named dt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .idf.moved{display:none}
  .areas{grid-area:areas;align-self:stretch;min-width:0;margin:0 -.7rem 0 -.86rem;height:auto;min-height:2.45rem}
  .hgroup{grid-area:actions;align-self:stretch;margin:0 -.86rem 0 0;padding:.3rem .86rem .3rem .7rem;border-top:1px solid var(--line)}
  /* Home: one scrolling pane, panels stacked. */
  .home-grid{display:block;overflow:auto;background:var(--paper)}
  .panel{display:block;border-bottom:1px solid var(--line)}
  .panel.side{background:var(--side)}
  .panel-body{overflow:visible}
  .panel.side .panel-foot .btn{flex:none}
  .pane-head .sub{display:none}
  /* Tables: one pane at a time, chosen from a switcher. */
  .tables{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .pane-switch{display:flex;align-items:center;gap:.6rem;padding:.35rem .86rem;background:var(--bg);border-bottom:1px solid var(--line)}
  .tables>.catalog,.tables>.records,.tables>.inspector{display:none}
  .tables[data-pane="catalog"]>.catalog,.tables[data-pane="records"]>.records{display:flex}
  .tables[data-pane="inspector"]>.inspector{display:grid}
  .insp-head{min-height:0}
  .titlerow:not(.has-return){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
  .titlerow.has-return>h2,.titlerow.has-return>.meta,.titlerow.has-return>.trail-sep{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .records .pane-head .spacer{flex:0 0 0}
  .files{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .files>.list,.files>.inspector{display:none}
  .files[data-pane="list"]>.list{display:flex}
  .files[data-pane="inspector"]>.inspector{display:grid}
  .files .insp-head{min-height:0}
  .files-filters{flex-wrap:wrap}
  .files-filters .fsearch{flex:1 1 10rem}
  .fcols{grid-template-columns:minmax(5.5rem,1fr) minmax(7rem,1.6fr) minmax(4.5rem,.7fr) minmax(5.5rem,1fr) minmax(5rem,.9fr)}
  .fcols>:nth-child(5){display:none}
  /* Filters collapse behind a nonmodal Filters disclosure; search stays visible. */
  .files-filters{flex-wrap:wrap}
  .fbtn{display:inline-flex}
  .fextra{display:none}
  .fextra.open{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem;flex:1 1 100%}
  .list-scroll{overflow-x:hidden}
  .subbar>span:last-child:not(.chip-filter){display:none}
  .activity-panel{width:100%}
  .statusbar .secondary{display:none}
}

/* Mockup-only state control. Not part of the design. */
.mock{position:fixed;left:.6rem;bottom:2.3rem;z-index:10;max-width:calc(100vw - 1.2rem);background:#243b3a;color:#fff;border-radius:6px;padding:.35rem .5rem;font:12px/1.6 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mock a{color:#cde7dc;text-decoration:none;padding:0 .35rem;border-radius:4px}
.mock a[aria-current="true"]{background:#176e66;color:#fff}
.mock .sep{opacity:.5}
</style></head>
<body>
<a class="skip" href="#area">Skip to content</a>
<div class="app" id="app">
  <header class="toolbar" id="toolbar">
    <div class="brand"><img src="../../../branding/vibeminer.svg" alt="VibeMiner"><span class="word" aria-hidden="true">Vibe<span>Miner</span></span></div>
    <div class="divider"></div>
    <dl class="idfields" id="idfields" aria-label="Open build"></dl>
    <div class="hgroup"><span id="activity-slot"></span><button class="btn primary" id="choose">← Choose build</button></div>
    <nav class="areas" id="areas" aria-label="Build areas"></nav>
  </header>
  <main id="area" tabindex="-1" style="display:grid;min-height:0;outline:none"></main>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<nav class="mock" aria-label="Mockup state (not part of the design)" id="mock"></nav>

<script>
const p=new URLSearchParams(location.search);
const state=p.get('state')||'idle';           // idle loading stopped downloading attention partial
let area=p.get('area')||'home';               // home tables files items creatures
let panelOpen=p.get('panel')==='open';
let popover=null, popoverTrigger=null;
const fromItems=p.get('from')==='items';      // Tables reached from an Items source
const gameData=p.get('game')!=='0';            // Items and Creatures available for this build
const newerCdn=p.get('cdn')==='newer';         // the source region now advertises a different CDN config
// Tables data state for the main table (Item): ready definition waiting stopped partial unsupported failed.
const tdata=p.get('tdata')||{loading:'waiting',stopped:'stopped',partial:'partial'}[state]||'ready';
const reftext=p.get('reftext')||'resolved';   // resolved pending unreadable: state of the reference-text lookup (#17)
// File catalog: ready notprepared preparing partial empty.
const catalog=p.get('catalog')||(state==='partial'?'notprepared':'ready');
const listfile=p.get('listfile')==='1';       // opt-in community listfile names
let homeOrigin=null;                           // control that left Home for a local destination (Browse in Files)
let tablesOrigin=null;                         // Tables record that followed a FileDataID into Files
if(p.get('text')==='200')document.documentElement.dataset.text='200';
if(p.get('chrome')==='0')document.getElementById('mock').remove();

const hex=seed=>{let h='',x=(seed*2654435761)>>>0;for(let i=0;i<32;i++){x=(x*1103515245+12345)>>>0;h+='0123456789abcdef'[x>>>28];}return h;};
const rand=s=>{let x=(s*2654435761)>>>0;return ()=>{x=(x*1103515245+12345)>>>0;return x>>>16;};};
const n=v=>v.toLocaleString('en-US');
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GiB=1073741824;
const gib=b=>(b/GiB).toFixed(1)+' GiB';
const kib=b=>b<1048576?(b/1024).toFixed(1)+' KiB':(b/1048576).toFixed(1)+' MiB';
const hx=v=>'0x'+v.toString(16).toUpperCase().padStart(8,'0');
// Authored sample: wow Retail, one exact build identity, US source, research locale enUS.
const build={product:'wow',label:'Retail',version:'12.1.5.70448',buildId:'70448',source:'US',advertised:['US','EU','KR'],id:hex(401),cfg:hex(1),cdn:hex(101),productCfg:hex(201)};
const dl={total:127131034112,verified:4509715660,shared:1503238553,metadata:299892736,objects:1312577,assessed:'Oct 18, 2026, 8:00 AM'};
dl.remaining=dl.total-dl.verified;
const cat={members:1284630,root:1207914,unique:1190882,generation:3};
const measured=state!=='partial';
const mode={idle:'off',loading:'checking',downloading:'on',attention:'on',partial:'unavailable',stopped:'off'}[state];
const attention=state==='attention';

/* ---------- Background work (one App-level list) ---------- */
const tasks=[];
if(state==='loading')tasks.push({group:'research',kind:'table'});
if(catalog==='preparing')tasks.push({group:'research',kind:'catalog'});
if(state==='downloading')tasks.push({group:'build',kind:'download'});
if(state==='attention')tasks.push({group:'outcome',kind:'failed'});
if(state==='stopped')tasks.push({group:'outcome',kind:'stopped'});
const showActivity=tasks.length>0;
// The badge counts research requests, saved Download all intents and records that need attention. Stopped outcomes are not counted.
const badge=tasks.filter(t=>t.kind!=='stopped').length;
const active=tasks.some(t=>t.group!=='outcome');

/* ---------- Header ---------- */
function renderHeader(){
  const ex=id=>popover===id, pop=id=>popover===id?popoverMarkup(id):'';
  const modeHtml=mode==='checking'?'<span class="dim" id="mode-value">Checking…</span>'
    :mode==='unavailable'?'<span class="dim" id="mode-value">On demand only</span>'
    :`<button class="switch" role="switch" id="mode-switch" aria-checked="${mode==='on'}" aria-labelledby="mode-label mode-value"><span class="track" aria-hidden="true"></span><span id="mode-value">${mode==='on'?'Download all':'On demand'}</span></button>`;
  document.getElementById('idfields').innerHTML=`
    <div class="idf named"><dt id="product-label">Product</dt><dd><button class="vbtn" id="product-btn" aria-haspopup="dialog" aria-expanded="${ex('identity-product')}" aria-labelledby="product-label product-value"><span id="product-value">${build.label} <span class="pid">${build.product}</span></span><span class="chev" aria-hidden="true">▾</span></button>${pop('identity-product')}</dd></div>
    <div class="idf named"><dt id="build-label">Build</dt><dd><button class="vbtn" id="build-btn" aria-haspopup="dialog" aria-expanded="${ex('identity-build')}" aria-labelledby="build-label build-value"><span id="build-value" class="selectable">${build.version}</span><span class="chev" aria-hidden="true">▾</span></button>${pop('identity-build')}</dd></div>
    <div class="idf moved"><dt>Source</dt><dd>${build.source}</dd></div>
    <div class="idf moved"><dt>Locale</dt><dd>English · enUS</dd></div>
    <div class="idf"><dt id="status-label">Status</dt><dd><button class="vbtn" id="status-btn" aria-haspopup="dialog" aria-expanded="${ex('status')}" aria-labelledby="status-label status-value"><span id="status-value">${measured?'Partial':'Configuration verified'}</span><span class="chev" aria-hidden="true">▾</span></button>${pop('status')}</dd></div>
    <div class="idf"><dt id="mode-label">Download mode</dt><dd>${modeHtml}</dd></div>`;
  document.getElementById('product-btn').onclick=e=>togglePopover('identity-product',e.currentTarget);
  document.getElementById('build-btn').onclick=e=>togglePopover('identity-build',e.currentTarget);
  document.getElementById('status-btn').onclick=e=>togglePopover('status',e.currentTarget);
  const sw=document.getElementById('mode-switch');
  // Mockup only: the switch jumps to the matching sample state. The real control commits a saved policy first.
  if(sw)sw.onclick=()=>go({state:mode==='on'?'idle':'downloading',panel:null});
  const close=document.getElementById('pop-close');
  if(close)close.onclick=()=>closePopover(true);
}

/* ---------- Activity entry and panel ---------- */
function taskHtml(t){
  if(t.kind==='table')return `<div class="task"><div class="t">Item · Table data · enUS</div><div class="s"><span aria-hidden="true">[2/4] </span>Downloading encoded object · ${build.source}<span class="visually-hidden">Stage 2 of 4.</span></div><div class="bar indeterminate" aria-hidden="true"><i></i></div><div class="s">Size of this stage not known yet</div><div class="row"><button class="btn">Stop loading Item</button><button class="btn" data-go="tables">View</button></div></div>`;
  if(t.kind==='catalog')return `<div class="task"><div class="t">File catalog · all published variants</div><div class="s"><span aria-hidden="true">[2/4] </span>Resolving ROOT metadata source · ${build.source}<span class="visually-hidden">Stage 2 of 4.</span></div><div class="bar indeterminate" aria-hidden="true"><i></i></div><div class="s">Size of this stage not known yet</div><div class="row"><button class="btn">Stop preparing catalog</button><button class="btn" data-go="files">View</button></div></div>`;
  if(t.kind==='download')return `<div class="task"><div class="t">${build.version} · Download all</div><div class="s"><span aria-hidden="true">[2/3] </span>Downloading encoded content · ${build.source}<span class="visually-hidden">Stage 2 of 3.</span></div><div class="bar" aria-hidden="true"><i style="width:25%"></i></div><div class="s">28.6 of 114.2 GiB · 25% of current stage</div><div class="row"><button class="btn">Pause build download</button><button class="btn">On demand</button></div></div>`;
  if(t.kind==='failed')return `<div class="task failed"><div class="t">${build.version} · Download all</div><div class="s">Failed at [2/3] Downloading encoded content · ${build.source}</div><div class="s">CDN returned 404 for 3 archives <code>(ARCHIVE_NOT_FOUND)</code></div><div class="s">Download all stays selected. Previously verified content is kept.</div><div class="row"><button class="btn">Resume build download</button><button class="btn">Dismiss outcome</button></div></div>`;
  return `<div class="task"><div class="t">Item · Table data · enUS</div><div class="s">Loading stopped at [2/4] Downloading encoded object · ${build.source}</div><div class="s">Previously verified content is preserved. Retry is a deliberate new request, from Tables.</div><div class="row"><button class="btn" data-go="tables">View</button><button class="btn">Dismiss outcome</button></div></div>`;
}
function panelHtml(){
  const sec=(g,label)=>{const list=tasks.filter(t=>t.group===g);return list.length?`<div class="label">${label}</div>${list.map(taskHtml).join('')}`:'';};
  return `<section class="activity-panel" id="activity" aria-labelledby="act-title"><header><h2 id="act-title" tabindex="-1">Downloads &amp; activity</h2><button class="btn small" id="activity-close">Close</button></header><div class="rows">${sec('research','Needed by your research')}${sec('build','Build downloads')}${sec('outcome','Recent outcome')}</div></section>`;
}
function renderActivity(){
  const slot=document.getElementById('activity-slot');
  if(!showActivity){slot.innerHTML='';return;}
  const parts=[];const r=tasks.filter(t=>t.group==='research').length;
  if(r)parts.push(`${r} current research request${r>1?'s':''}`);
  if(state==='downloading')parts.push('1 saved Download all intent');
  if(attention)parts.push('1 outcome to review');
  slot.innerHTML=`<button class="activity-chip${attention?' attention':''}" id="chip" aria-expanded="${panelOpen}" aria-controls="activity">${active?'<span class="pulse" aria-hidden="true"></span>':''}<span class="chip-long">${attention?'Needs attention':'Downloads &amp; activity'}</span><span class="chip-short">${attention?'Attention':'Activity'}</span>${badge?`<span class="count" aria-label="${parts.join(', ')}">${badge}</span>`:''}</button>${panelOpen?panelHtml():''}`;
  document.getElementById('chip').onclick=()=>{panelOpen=!panelOpen;closePopover(false);renderActivity();renderStatus();placeSurfaces();setInert();if(panelOpen)document.getElementById('act-title').focus();};
  const close=document.getElementById('activity-close');
  if(close)close.onclick=closePanel;
  slot.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closePanel();setArea(b.dataset.go);});
  setInert();
}
function openPanel(){if(!showActivity)return;panelOpen=true;closePopover(false);renderActivity();renderStatus();placeSurfaces();setInert();document.getElementById('act-title').focus();}
function closePanel(){panelOpen=false;renderActivity();renderStatus();setInert();document.getElementById('chip')?.focus();}
// Everything the panel covers is inert. At full width (enlarged text) that is the whole area; otherwise the side column or inspector.
function setInert(){
  const main=document.getElementById('area'),side=document.querySelector('.panel.side,.tables>.inspector,.files>.inspector'),panel=document.getElementById('activity');
  const full=!!panel&&panel.offsetWidth>=document.documentElement.clientWidth-1;
  main.inert=panelOpen&&full;
  if(side)side.inert=panelOpen&&!full;
}

/* ---------- Popovers (identity, Status): nonmodal dialogs right after their trigger ---------- */
function popoverHtml(id){
  if(id==='status'){
    const rows=measured?[
      ['Selected build',`${build.product} · ${build.version} · source ${build.source} · enUS`],
      ['Published encoded content',`${n(dl.total)} bytes`],
      ['Verified locally at opening assessment',`${n(dl.verified)} bytes`],
      ['Remaining at opening assessment',`${n(dl.remaining)} bytes`],
      ['Opening assessment scope','Download manifest · all published variants (encoded)'],
      ['Declared encoded objects',n(dl.objects)],
      ['Opening assessment',dl.assessed],
      ['Current presence assessment',state==='loading'?'Checking saved download status…':'Not available for this exact scope'],
      ['Fresh content verification','Not assessed by this view']]
     :[['Selected build',`${build.product} · ${build.version} · source ${build.source} · enUS`],['Published encoded scope','Unknown · DOWNLOAD_MANIFEST_UNSUPPORTED'],['Current presence assessment','Not available for this exact scope'],['Fresh content verification','Not assessed by this view']];
    return {title:'Local content & storage',body:`<dl class="facts">${rows.map(([k,v])=>`<dt>${k}</dt><dd class="selectable">${v}</dd>`).join('')}</dl>
      <p class="tiny">Presence is a dated existence and length check, not a fresh hash check. Encoded published variants are not installed size, disk usage or remaining network traffic.</p>
      ${measured&&state!=='loading'?'<div class="row"><button class="btn small">Check download status</button></div>':''}`};
  }
  return {title:'Selected build identity',body:`<dl class="facts">
    <dt>Product</dt><dd>World of Warcraft · ${build.label}</dd>

/* ---------- Area navigation ---------- */
function renderAreas(){
  // Home, then the raw source layer (Tables, Files), then VibeMiner's joined views (Items, Creatures).

  const groups=[[null,[['home','Home']]],['Source data',[['tables','Tables'],['files','Files']]],...(gameData?[['Game data',[['items','Items'],['creatures','Creatures']]]]:[])];
  const btn=([id,l])=>`<button data-area="${id}"${area===id?' aria-current="page"':''}>${l}</button>`;

// The area bar focuses the destination heading. A local return (Return to build overview) restores the control that left Home instead.
function setArea(a,restore){
  area=a;document.getElementById('app').dataset.area=a;
  const q=new URLSearchParams(location.search);q.set('area',a);history.replaceState(null,'','?'+q);
  renderAreas();renderArea();renderStatus();renderMock();setInert();
  const back=restore&&document.getElementById(restore.id);

  const h=document.querySelector('#area h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}
}

  let body;
  if(catalog==='notprepared')body=`<div class="pane-scroll"><div class="local-wait"><div class="state-box plain"><strong>File catalog not prepared</strong><p>The catalog lists every ROOT and install membership of this build, for all published variants. Preparing it reads the ROOT and install manifests; no game files are downloaded.</p><div class="row"><button class="btn small primary">Prepare file catalog</button></div></div></div></div>`;
  else if(catalog==='preparing')body=`<div class="pane-scroll"><div class="local-wait"><div class="state-box" role="status"><strong>Preparing file catalog</strong><p><span class="dim">[2/4] Resolving ROOT metadata source · ${build.source}</span></p><p class="dim">The list appears when the catalog is sealed. Progress is in Downloads &amp; activity.</p><div class="row"><button class="btn small">Stop preparing catalog</button><button class="btn small" data-task>View task</button></div></div></div></div>`;
  else if(!rows.length)body=`<div class="pane-scroll"><div class="local-wait"><div class="state-box plain"><strong>No files match</strong><p>No file in this build's prepared catalog ${fq?(/^\d+$/.test(fq)?`has FileDataID ${esc(fq)}`:`has a content key starting ${esc(fq)}`)+(act?` with these filters (${act} active)`:''):'matches these filters'}.</p><div class="row"><button class="btn small" id="clear-files">Clear filters</button></div></div></div></div>`;
  else body=`<div class="list-scroll" id="file-list"><div class="fcols fthead" aria-hidden="true"><span>FileDataID</span><span>Name</span><span>Memberships</span><span>Encoded size</span><span>Locales</span><span>Local</span></div>
    <div role="listbox" id="files-lb" aria-label="Files, one row per FileDataID" tabindex="0" aria-activedescendant="fopt-${fsel}">${rows.map((g,i)=>{const ck=new Set(g.members.map(r=>r.ckey)).size,locs=[...new Set(g.members.flatMap(r=>locNames(r.loc)))];
      return `<div role="option" id="fopt-${i}" class="fcols${i===fsel?' active':''}" aria-selected="${i===fsel}" data-i="${i}"><span class="fid">${g.fdid}</span><span class="fname-cell">${g.name?`<span class="mono">${g.name}</span><span class="pill community">Community</span>`:'<span class="dim">Name not known</span>'}</span><span>${g.members.length}${ck>1?` <span class="dim">· ${ck} CKeys</span>`:''}</span><span>${sizeSummary(g)}</span><span>${locs.join(', ')||'<span class="dim">No known bit</span>'}</span><span>${localSummary(g)}</span></div>`;}).join('')}</div></div>
    ${catalog==='partial'?'<div class="notice" style="margin-bottom:.6rem"><div class="text"><strong>Catalog ready with unresolved content keys</strong>10 ROOT content keys have no encoding entry in this build <code>(CONTENT_UNRESOLVED)</code>. Those memberships show no EKey or encoded size. They are not corrupt and not absent.</div></div>':''}`;
  const foot=`<div class="pane-foot">${homeOrigin?'<button class="btn" id="return-home">← Return to build overview</button>':''}${tablesOrigin?`<button class="btn" id="return-table">← Return to ${tablesOrigin.table} record ${tablesOrigin.id}</button>`:''}<span>${off?'Catalog not prepared':rows.length?`FileDataIDs 1–${rows.length}${fq||act?' matching':''} · ${n(cat.members)} memberships · generation ${cat.generation}`:'0 FileDataIDs'}</span><span class="spacer"></span><button class="btn" aria-disabled="true">First page</button><button class="btn" aria-disabled="true">Previous page</button><button class="btn"${off||fq||act||!rows.length?' aria-disabled="true"':''}>Next page</button></div>`;
  const sel=rows[fsel];
  const insp=!sel?`<aside class="inspector" aria-labelledby="finsp-title"><div class="insp-head"><div class="label">File inspector</div><h2 id="finsp-title">No file selected</h2></div><div class="insp-body"><p class="reason" style="font-size:var(--fs-m)">${off?'The catalog has no memberships to inspect yet.':'Nothing matches these filters.'}</p><p class="tiny">ROOT maps FileDataIDs to content keys per locale and content variant. It has no file names.</p></div></aside>`
    :(()=>{const all=sel.members,ck=new Set(all.map(r=>r.ckey)).size;
      return `<aside class="inspector" aria-labelledby="finsp-title"><div class="insp-head"><div class="label">File inspector</div><h2 id="finsp-title" class="selectable">FileDataID ${sel.fdid}</h2><p>ROOT · ${all.length} membership${all.length>1?'s':''}</p></div>
      <div class="insp-body"><dl class="facts"><dt>FileDataID</dt><dd class="selectable">${sel.fdid}</dd><dt>Name</dt><dd>${sel.name?`<span class="mono selectable">${sel.name}</span><br><span class="dim">From the community listfile (opt-in). Not from Blizzard; ROOT has no names.</span>`:'Name not known. ROOT has no names; a name hash is not a filename.'}</dd><dt>Memberships</dt><dd>${all.length} in ROOT${ck>1?` · ${ck} different content keys`:''}</dd></dl>
      ${all.map(r=>`<div class="member"><div class="label" style="margin:0 0 .35rem">Membership ${r.mid}</div><dl class="facts">
        <dt>Family</dt><dd>ROOT · block ${r.block}, entry ${r.entry}</dd>
        <dt>Locale flags</dt><dd><span class="mono">${hx(r.loc)}</span> · ${locNames(r.loc).join(', ')||'no known locale bit'}</dd>
        <dt>Content flags</dt><dd><span class="mono">${hx(r.cf[0]|r.cf[1]|(r.cf[2]<<17))}</span> <span class="dim">raw parts ${hx(r.cf[0])} · ${hx(r.cf[1])} · ${r.cf[2]}</span></dd>
        <dt>Name hash</dt><dd class="mono selectable">${r.hash}</dd>
        <dt>Content key</dt><dd class="mono selectable">${r.ckey}</dd>
        <dt>Encoding key</dt><dd class="mono selectable">${r.ekey??'<span class="warn-t">Unresolved · CONTENT_UNRESOLVED</span>'}</dd>
        <dt>Decoded length</dt><dd>${n(r.dec)} bytes</dd>
        <dt>Encoded length</dt><dd>${r.enc===null?'Unknown':`${n(r.enc)} bytes`}</dd>
        <dt>Local object</dt><dd>${r.stored?'<span class="ok">Stored locally</span> · verified Oct 18, 2026, 8:00 AM':'Not stored. Fetched on demand when something needs it.'}</dd></dl></div>`).join('')}
      <p class="tiny">A membership is not a unique file. Content flags are raw facts; no platform is inferred from them. Decoded length is a metadata fact, not proof that a decoder supports the file.</p></div></aside>`;})();
  return `<section class="files" data-pane="${tablePane==='inspector'?'inspector':'list'}" aria-label="Files">
    <div class="pane-switch"><div class="segmented" role="group" aria-label="Show pane"><button data-fpane="list" aria-pressed="${tablePane!=='inspector'}">Files list</button><button data-fpane="inspector" aria-pressed="${tablePane==='inspector'}">Selected file</button></div></div>
    <section class="pane list" aria-labelledby="files-title">${filters}${body}${foot}</section>${insp}</section>`;
}

function placeholderHtml(name){
  return `<section class="placeholder"><div><h1>${name}</h1><p>Not drawn in this mockup. ${name} uses the same shell: header, area bar, its own panes and the status bar.</p></div></section>`;
}

function renderArea(){
  const el=document.getElementById('area');
  el.innerHTML=area==='home'?homeHtml():area==='tables'?tablesHtml():area==='files'?filesHtml():placeholderHtml({items:'Items',creatures:'Creatures'}[area]||'Area');
  el.querySelectorAll('[data-area-go]').forEach(b=>b.onclick=()=>{tablesOrigin=null;homeOrigin={id:b.id,scroll:document.querySelector('.home-grid')?.scrollTop||0};setArea(b.dataset.areaGo);});
  const ret=document.getElementById('return-home');if(ret)ret.onclick=()=>setArea('home',homeOrigin);
  const rt=document.getElementById('return-table');if(rt)rt.onclick=()=>{const o=tablesOrigin;tablesOrigin=null;pos=o.pos;trail[pos].sel=o.sel;tablePane='records';setArea('tables');const b=document.querySelectorAll('.records-grid:not(.struct) .rowsel')[o.sel];if(b){b.focus({preventScroll:true});b.closest('tr').scrollIntoView({block:'nearest'});}};
  el.querySelectorAll('[data-task]').forEach(b=>b.onclick=openPanel);
  el.querySelectorAll('.pane-switch [data-pane]').forEach(b=>b.onclick=()=>{tablePane=b.dataset.pane;renderArea();el.querySelector(`.pane-switch [data-pane="${tablePane}"]`).focus();});
  el.querySelectorAll('.pane-switch [data-fpane]').forEach(b=>b.onclick=()=>{tablePane=b.dataset.fpane==='inspector'?'inspector':'records';renderArea();el.querySelector(`.pane-switch [data-fpane="${b.dataset.fpane}"]`).focus();});
  const ri=document.getElementById('return-items');if(ri)ri.onclick=()=>setArea('items');
  if(area==='tables')wireTables(el);
  if(area==='files')wireFiles(el);
  setInert();
}
function wireTables(el){
  const v=view();
  el.querySelectorAll('.tableitem').forEach(b=>b.onclick=()=>{const t=b.dataset.table;trail=[{table:t,tab:v.tab,sel:DEFS[t]&&ROWS[t]?0:null,field:'ID',filter:null,label:t}];pos=0;showRecords();});
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{v.tab=b.dataset.tab;renderArea();el.querySelector(`[data-tab="${v.tab}"]`).focus();});
  el.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=()=>{pos=+b.dataset.crumb;renderArea();renderStatus();document.querySelector(`[data-crumb="${pos}"]`)?.focus();});
  const back=document.getElementById('trail-back'),fwd=document.getElementById('trail-fwd');
  if(back)back.onclick=()=>{if(pos>0){pos--;renderArea();renderStatus();document.getElementById('trail-back').focus();}};
  if(fwd)fwd.onclick=()=>{if(pos<trail.length-1){pos++;renderArea();renderStatus();document.getElementById('trail-fwd').focus();}};
  const cf=document.getElementById('clear-filter');if(cf)cf.onclick=()=>{v.filter=null;v.sel=0;v.label=v.table;renderArea();(document.getElementById('rid')||document.getElementById('trail-back'))?.focus();};
  const rows=v.filter?lookup(v.table,v.filter.col,v.filter.value):(ROWS[v.table]||[]);
  // Follow a declared reference with this record's raw value: same build, source and locale; the target column, never a guess.
  const follow=(fieldName,row)=>{const f=DEFS[v.table].fields.find(x=>x.n===fieldName),val=row[fieldName],{t,c}=refParts(f.ref),k=targetKind(t);
    if(k==='files'){fq=String(val);fsel=0;homeOrigin=null;tablesOrigin={table:v.table,sel:v.sel,pos,id:row.ID};setArea('files');return;}
    if(k!=='bundled')return;
    v.field=fieldName;const m=lookup(t,c,val);
    navigate({table:t,tab:'data',sel:m.length===1?0:null,field:c,filter:{col:c,value:val},label:t});};
  el.querySelectorAll('.records-grid:not(.struct) tbody tr').forEach(tr=>tr.onclick=e=>{const i=+tr.dataset.i,cell=e.target.closest('[data-follow]');v.sel=i;if(cell){follow(cell.dataset.follow,rows[i]);return;}selectRow();});
  el.querySelectorAll('.inspector [data-follow]').forEach(b=>b.onclick=()=>follow(b.dataset.follow,rows[v.sel===null?0:v.sel]));
  el.querySelectorAll('.records-grid.struct tbody tr').forEach(tr=>tr.onclick=()=>{v.field=tr.dataset.field;renderArea();el.querySelector(`.struct tr[data-field="${v.field}"] .rowsel`)?.focus({preventScroll:true});});
  el.querySelectorAll('[data-follow-def]').forEach(b=>b.onclick=()=>{const f=DEFS[v.table].fields.find(x=>x.n===b.dataset.followDef);v.field=f.n;const {t,c}=refParts(f.ref);navigate({table:t,tab:'structure',sel:null,field:c,filter:null,label:`${t}.${c}`});});
  el.querySelectorAll('[data-files-of]').forEach(b=>b.onclick=()=>{homeOrigin=null;tablesOrigin=null;setArea('files');});
  const g=el.querySelector('.records-grid:not(.struct)')?.closest('.grid-scroll');
  if(g)g.onkeydown=e=>{const tgt={ArrowDown:(v.sel??-1)+1,ArrowUp:(v.sel??1)-1,Home:0,End:rows.length-1}[e.key];if(tgt!==undefined){e.preventDefault();v.sel=Math.max(0,Math.min(rows.length-1,tgt));selectRow();}};
}
function selectRow(){
  const g=document.querySelector('.records-grid:not(.struct)')?.closest('.grid-scroll'),top=g?g.scrollTop:0,left=g?g.scrollLeft:0;
  renderArea();
  const ng=document.querySelector('.records-grid:not(.struct)')?.closest('.grid-scroll');if(ng){ng.scrollTop=top;ng.scrollLeft=left;}
  const b=document.querySelectorAll('.records-grid:not(.struct) .rowsel')[view().sel];if(b){b.focus({preventScroll:true});b.closest('tr').scrollIntoView({block:'nearest'});}
}
function wireFiles(el){
  const lb=document.getElementById('files-lb'),rows=filesRows();
  const move=i=>{fsel=Math.max(0,Math.min(rows.length-1,i));const sc=document.getElementById('file-list')?.scrollTop||0;renderArea();const l=document.getElementById('files-lb');document.getElementById('file-list').scrollTop=sc;l.focus({preventScroll:true});document.getElementById('fopt-'+fsel).scrollIntoView({block:'nearest'});};
  if(lb){lb.querySelectorAll('[role=option]').forEach(o=>o.onclick=()=>move(+o.dataset.i));
    lb.onkeydown=e=>{const t={ArrowDown:fsel+1,ArrowUp:fsel-1,Home:0,End:rows.length-1,PageDown:fsel+10,PageUp:fsel-10}[e.key];if(t!==undefined){e.preventDefault();move(t);}};}
  const s=document.getElementById('file-search');if(s)s.onchange=()=>{fq=s.value.trim();fsel=0;renderArea();document.getElementById('file-search').focus();};
  const c=document.getElementById('clear-files');if(c)c.onclick=()=>{fq='';floc=0;fflag='any';ffam='all';fstored=false;fsel=0;renderArea();document.getElementById('file-search')?.focus();};
  const again=id=>{fsel=0;renderArea();document.getElementById(id)?.focus();};
  const fb=document.getElementById('filters-btn');if(fb)fb.onclick=()=>{filtersOpen=!filtersOpen;again('filters-btn');};
  const fl=document.getElementById('f-loc');if(fl)fl.onchange=()=>{floc=+fl.value;again('f-loc');};
  const ff=document.getElementById('f-flag');if(ff)ff.onchange=()=>{fflag=ff.value;again('f-flag');};
  const fs=document.getElementById('f-stored');if(fs)fs.onchange=()=>{fstored=fs.checked;again('f-stored');};
  el.querySelectorAll('[data-fam]').forEach(b=>b.onclick=()=>{ffam=b.dataset.fam;fsel=0;renderArea();el.querySelector(`[data-fam="${ffam}"]`)?.focus();});
}

/* ---------- Status bar: exact build, source and locale on every area ---------- */
function renderStatus(){
  const sum=panelOpen?'':attention?`<span class="warn">1 needs attention · ${build.version} download failed</span>`
    :state==='downloading'?`<span class="busy"><span class="pulse" aria-hidden="true"></span>${build.version} · Downloading encoded content · 25% of current stage</span>`
    :state==='loading'?'<span class="busy"><span class="pulse" aria-hidden="true"></span>Item · Opening table data · [2/4]</span>'
    :catalog==='preparing'?'<span class="busy"><span class="pulse" aria-hidden="true"></span>File catalog · Preparing · [2/4]</span>':'';
  const id=`<span><strong>${build.product} ${build.version}</strong> · ${build.source} · enUS</span>`;
  const t=area==='tables'?view().table:null,ds=t?dataState(t):null;
  const left=id+(area==='tables'
    ?`<span class="secondary">Definitions <strong>WoWDBDefs</strong> · ${PROV.rev.slice(0,7)}</span><span class="secondary">${t} · ${ds==='ready'?`<strong>${t==='Item'?'171,392':ROWS[t]?.length??0}</strong> admitted rows`:ds==='partial'?'readable rows · Partial':ds==='stopped'?'loading stopped':ds==='none'?'no bundled definition':'records not prepared'}</span>`
    :area==='files'?`<span class="secondary">${['notprepared','preparing'].includes(catalog)?'File catalog not prepared':`Catalog generation <strong>${cat.generation}</strong> · ${n(cat.members)} memberships`}</span>${listfile?'<span class="secondary">Names: community listfile (opt-in)</span>':''}`
    :area==='home'?(measured?`<span class="secondary">Assessed <strong>${dl.assessed}</strong></span>`:'<span class="secondary">Download size unknown</span>'):'');
  document.getElementById('statusbar').innerHTML=`${left}<span class="spacer"></span>${sum}`;
}

/* ---------- Keyboard ---------- */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(popover){closePopover(true);}else if(panelOpen){closePanel();}
    else if(area==='files'&&filtersOpen&&document.activeElement?.closest('.files-filters')&&getComputedStyle(document.getElementById('filters-btn')).display!=='none'){filtersOpen=false;renderArea();document.getElementById('filters-btn').focus();}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&(area==='tables'||area==='files')){e.preventDefault();const id=area==='tables'?'table-search':'file-search';
    if(area==='tables'&&getComputedStyle(document.querySelector('.catalog')).display==='none'){tablePane='catalog';renderArea();}
    if(area==='files'&&getComputedStyle(document.querySelector('.files>.list')).display==='none'){tablePane='records';renderArea();}
    document.getElementById(id)?.focus();}
});
addEventListener('resize',()=>{placeSurfaces();setInert();});

/* ---------- Mockup control ---------- */
function go(changes){const q=new URLSearchParams(location.search);for(const[k,v]of Object.entries(changes)){if(v===null)q.delete(k);else q.set(k,v);}location.search=q.toString();}
function renderMock(){
  const mock=document.getElementById('mock');if(!mock)return;
  const cur=new URLSearchParams(location.search);
  const link=(k,v,label,def,reset=[])=>{const q=new URLSearchParams(cur);q.set(k,v);for(const r of reset)q.delete(r);if(k==='state')q.delete('panel');const on=(cur.get(k)||def)===v;return `<a href="?${q}" aria-current="${on}">${label}</a>`;};
  const sep='<span class="sep">|</span>';
  let h='<strong style="margin-right:.2rem">Mockup</strong>'+[['idle','Idle'],['loading','Loading'],['stopped','Load stopped'],['downloading','Downloading'],['attention','Needs attention'],['partial','Partial data']].map(([v,l])=>link('state',v,l,'idle',['tdata','catalog'])).join('')
    +sep+link('area','home','Home','home')+link('area','tables','Tables','home')+link('area','files','Files','home');
  if(area==='tables')h+=sep+[['data','Data'],['structure','Structure'],['relations','Relationships']].map(([v,l])=>link('tab',v,l,'data')).join('')
    +sep+[['ready','Ready'],['definition','Definition only'],['partial','Encrypted sections'],['unsupported','Unsupported layout'],['failed','Failed']].map(([v,l])=>link('tdata',v,l,'')).join('')
    +sep+[['resolved','Text resolved'],['pending','Text pending'],['unreadable','Target protected']].map(([v,l])=>link('reftext',v,l,'resolved')).join('')
    +sep+[['12','Follow: one'],['7','Follow: several'],['5','Follow: none']].map(([v,l])=>link('follow',v,l,'')).join('')+link('from','items','From Items','');
  if(area==='files')h+=sep+[['ready','Ready'],['notprepared','Not prepared'],['preparing','Preparing'],['partial','Partial'],['empty','No match']].map(([v,l])=>link('catalog',v,l,'')).join('')+link('listfile','1','Community names','')+link('ff','1','Two filters on','')+link('fopen','1','Filters open','');
  h+=sep+link('game','0','No game data','')+link('cdn','newer','Newer CDN config','')+sep+link('text','100','100%','100')+link('text','200','200%','100')+(showActivity?sep+link('panel','open','Panel open',''):'');
  mock.innerHTML=h;
}

document.getElementById('app').dataset.area=area;
renderHeader();renderActivity();renderAreas();renderArea();renderStatus();renderMock();placeSurfaces();setInert();
if(p.get('popover')){const t={status:'status-btn',identity:'build-btn'}[p.get('popover')];if(t)document.getElementById(t).click();}
</script>
</body></html>
