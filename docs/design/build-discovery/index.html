ption).join('')}</optgroup></select><p class="subtle">Exact ID: <code>${exactProduct}</code> · Friendly labels: <a href="PRODUCT-NAMES.md">source notes</a>. Warcraft products only. Exact source identities remain separate.</p></section>`}function editions(){return ['Retail','Classic','Classic Era','Anniversary'].map((e,i)=>`<button class="edition ${edition===e?'selected':''}" data-edition="${e}"><b>${e}</b><span>${['Modern World of Warcraft','Progression realms','Classic-era worlds','Anniversary realms'][i]}</span></button>`).join('')}function badgeRegions(d){return d.regions.length?d.regions.filter(r=>state!=='partial'||r!=='TW').map(r=>`<span class="region">${r}</span>`).join(''):'<span class="subtle">Saved observation</span>'}function details(){let d=data.find(x=>x.id===selected);if(!d||state==='empty'||state==='loading')return `<aside class="detail"><div class="eyebrow">Build inspector</div><div class="empty"><div class="symbol">⌕</div><h3>Select a build</h3><p class="subtle">Review its exact identity and available next steps here.</p></div><p class="subtle">Browsing metadata never starts a content download.</p></aside>`;return `<aside class="detail"><div class="eyebrow">Selected build</div><h2>${d.version}</h2><p class="subtle">${edition} · ${channel} · ${badgeRegions(d)}</p><div class="status"><strong>Build status: ${buildStatus(d)}</strong><br>${buildActivity(d)?`<span>${buildActivity(d)}</span><br>`:''}<span>Scope: Windows · enUS</span><br><span>${metadataStatus(d)==='Ready'?'Required metadata ready':'Required metadata is not ready'}</span><br><span>Remote availability: ${d.availability.toLowerCase()}</span></div>${d.id==='a'&&contentMode==='full'?'<p class="subtle" style="margin-top:8px">All content in the selected Windows / enUS scope is retained and verified. This does not guarantee every format can be decoded.</p>':''}${d.id==='a'&&contentMode==='incomplete'?'<div class="notice">Some selected content is missing or failed verification. Review is needed; metadata remains usable.</div>':''}<dl><dt>Game / edition</dt><dd>${family()} · ${edition}</dd><dt>Publication</dt><dd>${state==='offline'?'Saved observation · not refreshed':d.source}</dd><dt>Observed in this preview</dt><dd>${d.seen}</dd><dt>Build configuration</dt><dd class="mono">${d.config}</dd></dl>${d.regions.length>1?'<div class="hint"><strong>Same build data across these regions.</strong><br>The exact build references match; choose the build once.</div>':''}<p class="subtle">Preferred download source: <strong>${sourceRegion||d.regions[0]||'Not available'}</strong><br>Routing preference only; this does not change the selected build data.</p><details><summary class="subtle">Change download source</summary><label class="subtle" for="buildRegion">Preferred source</label><select id="buildRegion" style="width:100%;margin:8px 0">${d.regions.map(r=>`<option ${(sourceRegion||d.regions[0])===r?'selected':''}>${r}</option>`).join('')}</select></details>${preparing===d.id?'<div class="hint" role="status"><strong>Opening build…</strong><br>Downloading and verifying required metadata.<div class="loader"></div>No whole-game content download.<button data-action="cancel-open">Cancel opening</button></div>':`<button class="primary" data-action="open">Open Build</button>`}${openError?`<div class="notice" role="alert">${openError} Use Open Build to retry.</div>`:''}<button data-action="advanced">Source details ↗</button><p class="subtle" style="margin-top:18px">Saving metadata is separate from downloading game content. A published pointer does not prove all files remain available.</p></aside>`}function list(){if(state==='empty')return `<div class="empty"><div class="symbol">◇</div><h2>${exactProduct==='wow'?'Your research starts with a build':'No authored build fixtures for this product'}</h2><p class="subtle">Choose a product above to load its published builds.<br>No game installation is needed.</p></div>`;if(state==='loading')return `<div class="empty" aria-live="polite"><h2>Reading official build metadata…</h2><p class="subtle">Reading region rows from official metadata. Content availability remains unchecked.</p><div class="loader"></div><button data-action="cancel">Cancel discovery</button></div>`;let filtered=data.filter(d=>(buildFilter==='all'||(buildFilter==='local'&&d.saved)||(buildFilter==='advertised'&&d.source==='Advertised now'&&state!=='offline'))&&(region==='all'||d.regions.includes(region)||(!d.regions.length&&d.saved))&&(d.version.includes(query)||d.build.includes(query))&&(state!=='offline'||d.saved)&&(state!=='partial'||d.id!=='b'));return `${state==='partial'?'<div class="notice"><strong>3 of 4 regions responded.</strong> Taiwan could not be reached. These results are incomplete; no conclusion is drawn about builds in that region. <button data-action="retry">Retry Taiwan</button></div>':''}${state==='offline'?'<div class="notice"><strong>You’re offline.</strong> Showing saved observations only. Advertised status has not been refreshed. Unsaved results are unavailable.</div>':''}<div class="tools"><input id="search" aria-label="Filter versions or build numbers" placeholder="Filter version or build number" value="${query.replaceAll('&','&amp;').replaceAll('\"','&quot;').replaceAll('<','&lt;')}"><select id="region" aria-label="Region"><option value="all">All advertised regions</option>${['US','EU','KR','TW'].map(r=>`<option ${region===r?'selected':''}>${r}</option>`).join('')}</select><div role="group" aria-label="Build visibility"><button data-filter="all" class="${buildFilter==='all'?'selected':''}">All</button><button data-filter="local" class="${buildFilter==='local'?'selected':''}">Local</button><button data-filter="advertised" class="${buildFilter==='advertised'?'selected':''}">Currently advertised</button></div></div>${filtered.length?filtered.map(d=>`<button class="build ${selected===d.id?'selected':''}" data-build="${d.id}" aria-pressed="${selected===d.id}"><span><strong>${d.version}</strong><small>${d.id==='b'?'Different configuration · kept separate':d.id==='c'?'Local observation · not advertised in last check':'Build '+d.build}</small><small><strong style="font-size:11px;display:inline">Build status: ${buildStatus(d)}</strong>${buildActivity(d)?`<br>${buildActivity(d)}`:''}<br>Scope: Windows · enUS</small></span><span class="regions">${badgeRegions(d)}</span><span class="right"><span class="pill ${d.source==='Advertised now'&&state!=='offline'?'ad':''}">${state==='offline'?'Saved observation':d.source}</span>${d.saved?'<br><span class="pill saved">Local observation</span>':''}</span></button>`).join(''):'<div class="empty"><h3>No matching builds</h3><p class="subtle">Try another region or clear your version filter.</p></div>'}<p class="subtle">Rows combine regions only when exact build/configuration identities match; each region’s source and route remain separate. Matching version numbers with different configurations stay separate.</p>`}function family(){return ['d3','pro'].includes(exactProduct)?edition:'World of Warcraft'}function header(){return `<header class="apphead"><div class="brand"><img src="../../../branding/vibeminer.svg" width="32" height="32" alt=""> <span>Vibe<em>Miner</em></span></div><nav class="nav"><strong>Discover builds</strong></nav><div class="local">Standalone research · official CDN sources</div></header>`}function heading(title,desc){return `<div class="heading"><div><h2>${title}</h2><p class="subtle">${desc}</p></div><button data-action="discover" ${state==='loading'?'disabled':''}>↻ Refresh builds</button></div>`}function channelControl(){return `<div class="tools"><span class="subtle">Exact product: <strong>${product()}</strong> · Source label: ${channel}. Change products in the top dropdown.</span></div>`;return `<div class="tools"><label for="channel" class="subtle">Channel</label><select id="channel"><option ${channel==='Live'?'selected':''}>Live</option><option ${channel==='Public test'?'selected':''}>Public test</option></select><span class="subtle">Illustrative catalog labels</span></div>`}function render(){$('#contentPreview').value=contentMode;if(exactProduct!=='wow'&&state!=='loading'){state='empty';selected=null;}document.querySelectorAll('[data-concept]').forEach(b=>b.classList.toggle('selected',b.dataset.concept===concept));document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('selected',b.dataset.state===state));let a='';if(concept==='A')a=`<div class="layout"><aside class="sidebar"><div class="eyebrow" style="margin-left:10px">Product context</div><div class="game-label">World of Warcraft</div><div class="eyebrow" style="margin-left:10px">Selected source</div><p class="subtle" style="margin:12px 10px">Selected product<br><strong>${product()}</strong><br>${edition} · ${channel}</p><div class="sectionline"><p class="subtle">Not sure which one?</p><p class="subtle">Use the edition you want to investigate. Each edition keeps its exact build identity.</p><button data-action="advanced">Advanced product IDs</button></div></aside><main class="main"><h1>Which builds do you want to explore?</h1><p class="subtle">Choose the exact Warcraft product to refresh its published builds.</p>${productPicker()}${heading(edition+' builds','Find an exact starting point for your investigation.')}<div class="count"><div><b>${state==='empty'||state==='loading'?'—':state==='offline'||state==='partial'?'2':'3'}</b><span>configurations before filters</span></div><div><b>${state==='empty'||state==='loading'?'—':state==='partial'?'3 / 4':state==='offline'?'Offline':'4 / 4'}</b><span>regional responses</span></div><div><b>${state==='empty'?'0':data.filter(d=>d.saved).length}</b><span>metadata snapshots saved</span></div></div>${list()}</main>${details()}</div>`;if(concept==='B')a=`<div class="layout wide"><main class="main"><div class="eyebrow">A simple starting point</div><h1>Which builds do you want to explore?</h1><p class="subtle">Choose the exact Warcraft product to refresh its published build list.</p>${productPicker()}${heading('Builds','Currently advertised and locally saved observations in one list.')}${list()}<div class="hint">Exact product codes identify the research source. Descriptive names explain the code; the exact ID always remains primary. <button data-action="advanced">Show advanced details</button></div></main>${details()}</div>`;if(concept==='C')a=`<div class="layout wide"><main class="main"><div class="eyebrow">Your research home</div><h1>What would you like to investigate?</h1><p class="subtle">Choose an exact product, then an exact build.</p>${productPicker()}<div class="hint">Research product: <strong>${product()}</strong> · ${edition} · ${channel}</div>${heading(edition+' · build library','Officially advertised builds and your saved observations, together.')}${list()}<div class="compare"><h3>Next: find what changed</h3><p class="subtle">Choose two compatible builds from the same edition to compare. This research workflow is planned.</p><button data-action="compare">Compare builds · planned</button></div><button data-action="advanced">Advanced product identifiers</button></main>${details()}</div>`;$('#app').innerHTML=header()+a+`<footer class="footer"><strong>Design prototype:</strong> builds, observations and regional combinations are illustrative fixtures. Core friendly names use <a href="PRODUCT-NAMES.md">reviewed product aliases</a>; decoder support is separate. No Forever mapping is inferred. No network, game-install access or real save occurs.</footer>`;bind()}function toast(t){$('#message').className='toast';$('#message').textContent=t;setTimeout(()=>{$('#message').className='';$('#message').textContent=''},5500)}let refreshGeneration=0;function discover(){openGeneration++;preparing=null;openError='';let generation=++refreshGeneration,requestedProduct=exactProduct;state='loading';selected=null;sourceRegion=requestedProduct==='wow'?'US':'';render();setTimeout(()=>{if(generation!==refreshGeneration||requestedProduct!==exactProduct||state!=='loading')return;if(exactProduct==='wow'){state='ready';selected='a';render();toast('Illustrative metadata loaded. No game content was downloaded.')}else{state='empty';selected=null;render();toast('No authored build fixtures for '+exactProduct+'. No other product’s builds are substituted.')}},1100)}function advanced(){if(!selected||exactProduct!=='wow'){$('#overlay').innerHTML=`<div class="drawer"><article role="dialog" aria-modal="true" aria-labelledby="raw-title"><header><h2 id="raw-title">Product source</h2><button id="close">Close ✕</button></header><p>Exact product: <strong>${product()}</strong></p><p>${edition} · ${channel}</p><p class="subtle">No build selected. No build configuration, version, regional route or availability is implied.</p><a href="PRODUCT-NAMES.md">Product naming evidence</a></article></div>`;$('#close').onclick=()=>$('#overlay').innerHTML='';$('#close').focus();return;}let d=data.find(x=>x.id===selected)||data[0];$('#overlay').innerHTML=`<div class="drawer"><article role="dialog" aria-modal="true" aria-labelledby="raw-title"><header><h2 id="raw-title">Raw discovery provenance</h2><button id="close">Close ✕</button></header><p class="subtle">Advanced details support precise research. Friendly names are curated UI labels; raw source identity is always retained.</p><h3>Selected illustrative identity</h3><pre>product: ${product()}
channel label: ${channel}
region observations: ${d.regions.join(', ')||'saved history'}
reference equivalence: ${d.regions.length>1?'exact build/config reference tuple matches across listed regions':'single-region or historical observation'}
preferred download source: ${sourceRegion||'not available'}
regional source / route: inspect separately before any acquisition
version: ${d.version}
build configuration: ${d.config}
CDN configuration: ${'d4'.repeat(16)}
source roles: versions + cdns
source host: official Blizzard metadata endpoint
availability: NOT CHECKED</pre><p class="subtle">Real implementation shows the exact per-region source URL, retrieval time and digest. A region is a metadata source, not proof of distinct game content.</p><h3>Other / unrecognized products</h3><p class="subtle">Unrecognized official product IDs remain available here as raw identifiers until their meaning is verified. They are never silently assigned a familiar edition name.</p><button id="raw-example">Warcraft source · wowdev5 (edition unconfirmed)</button><div class="notice">Synthetic examples only. This prototype does not claim that these display names are verified mappings, nor that any particular build is advertised now.</div></article></div>`;$('#close').onclick=()=>{$('#overlay').innerHTML='';};$('#raw-example').onclick=()=>toast('Unrecognized product — edition meaning and decoder support are not established.');$('#close').focus()}function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{openGeneration++;preparing=null;openError='';buildFilter=b.dataset.filter;selected=null;render()});if($('#buildRegion'))$('#buildRegion').onchange=e=>{openGeneration++;preparing=null;openError='';sourceRegion=e.target.value;render()};if($('#productSelect'))$('#productSelect').onchange=e=>{openGeneration++;preparing=null;openError='';exactProduct=e.target.value;sourceRegion='';let p=products.find(p=>p[0]===exactProduct);edition=p[2];channel=p[3];state='empty';selected=null;query='';savedOnly=false;buildFilter='all';discover()};document.querySelectorAll('[data-edition]').forEach(b=>b.onclick=()=>{edition=b.dataset.edition;selected=null;state='empty';query='';render()});document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{openGeneration++;preparing=null;openError='';selected=b.dataset.build;sourceRegion=data.find(d=>d.id===selected).regions[0]||'';render()});if($('#search'))$('#search').oninput=e=>{let pos=e.target.selectionStart;openGeneration++;preparing=null;openError='';query=e.target.value;selected=null;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};for(let id of ['region','regionStep'])if($('#'+id))$('#'+id).onchange=e=>{openGeneration++;preparing=null;openError='';region=e.target.value;selected=null;render()};if($('#channel'))$('#channel').onchange=e=>{channel=e.target.value;state='empty';selected=null;render()};if($('#editionSelect'))$('#editionSelect').onchange=e=>{edition=e.target.value;state='empty';selected=null;render()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='cancel-open'){openGeneration++;preparing=null;render();return;}if(a==='open'){let d=data.find(x=>x.id===selected),r=sourceRegion,key=exactProduct+'|'+d.id+'|'+r,generation=++openGeneration;openError='';if(exactProduct!=='wow'||d.id!=='a'||r!=='US'){openError='This authored mining-home preview supports only wow / build 70448 / configuration a1 / US. Your selection is preserved; no other build is substituted.';render();return;}let enter=()=>{if(generation!==openGeneration||key!==exactProduct+'|'+selected+'|'+sourceRegion)return;prepared.add(d.id+'|'+r);preparing=null;location.href='../build-mining-home/index.html?concept=archive&state=ready&content='+encodeURIComponent(contentMode);};if(prepared.has(d.id+'|'+r)){enter();return;}preparing=d.id;render();setTimeout(()=>{if(generation!==openGeneration||key!==exactProduct+'|'+selected+'|'+sourceRegion)return;if(params.get('metadata')==='error'&&!failureShown){failureShown=true;preparing=null;openError='Metadata verification failed in this illustrative preview. No mining view was opened.';render();return;}enter();},1500);return;}if(a==='discover'||a==='retry')discover();if(a==='cancel'){refreshGeneration++;state='empty';render()}if(a==='advanced')advanced();if(a==='saved'){openGeneration++;preparing=null;openError='';savedOnly=!savedOnly;selected=null;render()}if(a==='save'){let d=data.find(x=>x.id===selected);if(d.saved)toast('Prototype: open this exact saved metadata snapshot. No content download.');else{d.saved=true;render();toast('Prototype: metadata marked saved. No game content downloaded.')}}if(['availability','research','compare'].includes(a))toast('Planned workflow — shown for direction only; not implemented in this prototype.');})}$('#contentPreview').onchange=e=>{contentMode=e.target.value;render()};document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{concept=b.dataset.concept;render()});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{openGeneration++;preparing=null;openError='';state=b.dataset.state;selected=state==='empty'||state==='loading'?null:'a';render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML=''});render();
