<div class="states"><strong>Preview state</strong><button data-state="ready">First visit · ready</button><button data-state="partial">Metadata partial</button><button data-state="offline">Offline</button><button data-state="downloading">Full download active</button><label for="content-preview">Content</label><select id="content-preview" class="content-select"><option value="none">Not downloaded</option><option value="partial">Partial</option><option value="downloading">Downloading</option><option value="paused">Paused</option><option value="full">Fully downloaded</option><option value="incomplete">Incomplete</option></select><span>Local prototype · illustrative data</span></div><div id="app"></div><div id="overlay"></div><div id="message" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);const params=new URLSearchParams(location.search);let concept=['researcher','catalog','archive'].includes(params.get('concept'))?params.get('concept'):'archive';let state=['ready','partial','offline','downloading'].includes(params.get('state'))?params.get('state'):'ready';let content=['none','partial','downloading','paused','full','incomplete'].includes(params.get('content'))?params.get('content'):(state==='downloading'?'downloading':'partial');if(state==='partial'&&content==='full')content='incomplete';let mode=params.get('mode')==='all'?'all':params.get('mode')==='ondemand'?'ondemand':['downloading','paused'].includes(content)?'all':'ondemand';let retainedOverride=null,sharedOverride=null,foreground=false;let paused=content==='paused',lastFocus=null;function amount(){if(retainedOverride!==null)return retainedOverride;return content==='none'?0:content==='full'?118.4:['downloading','paused'].includes(content)?18.6:4.2}function shared(){if(sharedOverride!==null)return sharedOverride;return content==='none'?0:content==='full'?12.8:['downloading','paused'].includes(content)?3.1:1.4}function bytes(v){return v.toFixed(1)}function progress(){return state==='partial'?'Size unknown':(amount()/118.4*100).toFixed(2)+'% retained'}function activity(){return mode==='ondemand'?'On demand':content==='full'?'Complete':state==='offline'?'Waiting for connection':state==='partial'?'Waiting for metadata':content==='paused'?'Paused':content==='incomplete'?'Needs attention':'Downloading'}function setMode(next){if(next===mode)return;if(next==='all'){action('download');return}retainedOverride=amount();sharedOverride=shared();mode='ondemand';if(['downloading','paused'].includes(content))content='partial';paused=false;render();toast('Preview: bulk queue stopped. Retained bytes and individual research requests are preserved.')}function overallStatus(){return state==='partial'?'Not ready':content==='full'?'Fully downloaded':'Partial'}const labels={researcher:'Researcher home',catalog:'Catalog first',archive:'Build overview'};function sync(){history.replaceState(null,'','?concept='+concept+'&state='+state+'&content='+content+'&mode='+mode);document.querySelectorAll('[data-concept]').forEach(b=>{b.classList.toggle('selected',b.dataset.concept===concept);b.setAttribute('aria-pressed',b.dataset.concept===concept)});document.querySelectorAll('[data-state]').forEach(b=>{b.classList.toggle('selected',b.dataset.state===state);b.setAttribute('aria-pressed',b.dataset.state===state)})}function notice(){if(state==='partial')return '<div class="notice"><strong>Some build metadata is missing.</strong> The file catalog is available, but CDN archive indexes are incomplete. Browsing can continue; locating uncached files may fail.<button data-act="retry">Review & retry</button></div>';if(state==='offline')return '<div class="notice"><strong>You’re offline.</strong> Saved metadata and retained content are available. Opening an uncached file will need a connection. Remote availability has not been refreshed.</div>';return ''}function statCards(){return `<div class="stats"><div class="stat"><label>File catalog</label><strong>1,284,630</strong><small>Distinct FileDataIDs · enUS / Windows view</small><button data-act="catalog-stats">What is counted?</button></div><div class="stat"><label>Estimated full content</label><strong>${state==='partial'?'Not known':'118.4 GiB'}</strong><small>${state==='partial'?'Size coverage is incomplete':'Selected canonical encoded objects · 0 unknown sizes'}</small><button data-act="storage-stats">How size is measured</button></div><div class="stat"><label>Already retained for this build</label><strong>${bytes(amount())} GiB</strong><small>${bytes(shared())} GiB also referenced by other builds</small><button data-act="storage-stats">Shared once, not copied</button></div></div>`}function path(title,desc,icon,act,tag='Proposed research tool'){return `<button class="path" data-act="${act}"><span class="icon" aria-hidden="true">${icon}</span><span class="arrow" aria-hidden="true">↗</span><h3>${title}</h3><p>${desc}</p><small>${tag}</small></button>`}function researchPaths(){return `<section class="panel"><div class="paneltitle"><h2>What would you like to investigate?</h2><span>Start anywhere</span></div><div class="paths">${path('Explore game data','Find tables and supported records: items, spells, quests and more.','▦','tables')}${path('Browse files','Search file IDs, known filenames, formats and content identities.','≡','files')}${path('Explore art & sound','Discover textures, models and audio; previews depend on format support.','◈','assets')}${path('Find what changed','Choose a compatible comparison build and inspect differences.','⇄','changes')}</div><div class="researchline"><b>Follow your curiosity:</b> mounts & pets · class tuning · professions · story & world<br>These are investigation paths, not proof that a reward is obtainable or a feature is live.</div></section>`}function storagePanel(){return archive()}function readiness(){return `<section class="panel"><h3>Build readiness</h3><p class="tiny">Download policy · selected enUS / Windows scope</p><div class="modebuttons" role="group" aria-label="Download policy for this build"><button data-mode="ondemand" aria-pressed="${mode==='ondemand'}" class="${mode==='ondemand'?'selected':''}">On demand</button><button data-mode="all" aria-pressed="${mode==='all'}" class="${mode==='all'?'selected':''}">Download all</button></div><p class="tiny">Download all runs in the background.</p><div class="row"><span>File catalog</span><b>Ready to browse</b></div><div class="row"><span>Content locations</span><b class="${state==='partial'?'unknown':''}">${state==='partial'?'Indexes incomplete':'Metadata ready'}</b></div><div class="row"><span>Every file downloadable?</span><b class="unknown">Not checked</b></div><div class="row"><span>Research decoders</span><b>Support varies</b></div><p class="tiny">Overall status includes required metadata and selected enUS / Windows encoded content. “Partial” can mean metadata is ready while content remains on demand. “Fully downloaded” does not mean every file is decoded, readable or named.</p><button class="full" data-act="metadata">View metadata details</button></section>`}function findings(){return `<section class="panel"><h3>Your findings</h3><p class="muted">Nothing saved for this build yet. Keep interesting records and files with their source context.</p><button data-act="findings">Open findings · proposed</button></section>`}function catalog(){return `<section class="panel"><div class="paneltitle"><h2>Explore this build’s catalog</h2><span>Illustrative categories</span></div><label for="file-query" class="sr">Search file IDs or known names</label><input id="file-query" class="search" placeholder="Search file ID or known filename…"><table class="catalog"><thead><tr><th>Starting point</th><th>What you can explore</th><th>Support</th></tr></thead><tbody><tr><td><button data-act="tables">Game data tables</button></td><td>Items, spells, quests, rewards<small>Availability depends on exact schema support</small></td><td>Decoder dependent</td></tr><tr><td><button data-act="files">All catalog files</button></td><td>Identifiers, known paths and content hashes<small>Unnamed files remain visible by ID</small></td><td>Catalog first</td></tr><tr><td><button data-act="assets">Art & sound</button></td><td>Textures, models, music and voice<small>Encrypted, unsupported and unavailable are separate states</small></td><td>Previews proposed</td></tr></tbody></table><p class="tiny">Search is a design preview; no index or content is fetched by this HTML mockup.</p></section><section class="panel"><h3>Go beyond individual files</h3><p class="muted">Compare a compatible build, or organize discoveries into findings.</p><div class="shelf"><button data-act="changes">Compare builds · proposed</button><button data-act="findings">Saved findings · proposed</button></div></section>`}function overviewFacts(){return `<div class="stats compact"><div class="stat"><label>Selected file catalog</label><strong>1,284,630</strong><small>Distinct FileDataIDs · enUS / Windows view</small><button data-act="catalog-stats">Membership variants and unique content</button></div><div class="stat"><label>Estimated full selected content</label><strong>${state==='partial'?'Not known':'118.4 GiB'}</strong><small>${state==='partial'?'Object-size coverage incomplete':'Canonical encoded objects · 0 unknown lengths'}</small><button data-act="storage-stats">Scope and measurement details</button></div></div>`}
function overviewIssues(){return `<section class="panel"><h3>Needs attention</h3>${content==='incomplete'?'<p class="muted">Selected content retention is incomplete. Review unavailable or missing objects in the retention panel.</p>':''}${state==='partial'?'<p class="muted">Some archive indexes are missing. Catalog browsing remains available; uncached content locations may be unresolved.</p><button data-act="retry">Review missing metadata</button>':state==='offline'?'<p class="muted">Network unavailable. Retained content stays usable; uncached content waits for a connection.</p>':'<p class="muted">No metadata preparation errors in this preview.</p>'}<div class="row"><span>Encryption assessment</span><b>Not assessed</b></div><p class="tiny">No encrypted percentage is inferred. If measured, show the assessed denominator and unassessed remainder separately.</p></section>`}
function archive(){let active=mode==='all'&&content!=='full',local=amount(),sharedBytes=shared(),unknown=state==='partial',remaining=118.4-local;return `<section class="panel"><div class="paneltitle"><h2>Local content & shared storage</h2><span>Exact build · selected scope</span></div>${unknown?'<p class="muted">Overall retention coverage is unknown until selected object lengths are resolved.</p>':'<div class="chart"><div style="width:'+((local-sharedBytes)/118.4*100)+'%"></div><div style="width:'+(sharedBytes/118.4*100)+'%"></div><div></div></div>'}<div class="legend"><span><i class="dot"></i>Retained · only this build</span><span><i class="dot shared"></i>Retained · shared</span><span><i class="dot missing"></i>Not retained</span></div><div class="row"><span>Retained object bytes referenced by this build</span><b>${bytes(local)} GiB</b></div><div class="row"><span>Of those, shared with other builds</span><b>${bytes(sharedBytes)} GiB</b></div><div class="row"><span>Estimated additional encoded content</span><b>${unknown?'Unknown':bytes(remaining)+' GiB'}</b></div><div class="row"><span>Separate metadata and derived indexes</span><b>286 MiB</b></div><p class="tiny">Shared bytes are included in retained bytes, not added again. Identical objects are stored once. These are not installed-game sizes or reclaimable-disk promises.</p>${active?`<div class="job"><div class="paneltitle"><h3>Background retention</h3><span class="badge">${foreground&&state!=='offline'&&content!=='paused'?'Yielding to your request':activity()}</span></div><p class="muted">Selected enUS / Windows encoded content. Mining remains available.</p><p class="tiny">${unknown?'Overall percentage unknown.':progress()+' of the fixed selected encoded-byte scope.'} Includes reused content; not transfer progress or verified-decode coverage.</p><div class="actions"><button data-act="pause" ${state==='offline'||state==='partial'?'disabled':''}>${content==='paused'?'Resume':'Pause'} download</button></div></div>`:content==='full'?'<div class="job"><h3>Selected content retained</h3><p class="muted">All catalogued encoded objects in this enUS / Windows scope are retained and verified. No download is running.</p><p class="tiny">Encrypted content may remain unreadable. Retention does not imply successful decoding or preview support.</p></div>':`<div class="job"><h3>${content==='incomplete'?'Retention needs attention':'On-demand by default'}</h3><p class="muted">${content==='incomplete'?'Some selected content could not be retained. Review missing or unavailable objects before retrying.':'Content is fetched as you explore. Retaining the selected build in full is optional.'}</p><p class="tiny">Use the Download policy control in Build readiness to enable background retention for this build.</p>${state==='offline'?'<p class="tiny">Requires a connection.</p>':''}<p class="tiny">Switching to On demand stops bulk work, preserves existing shared content and keeps individual research requests active.</p></div>`}</section>`}

an>Changes<small>PROPOSED</small></button><button class="sidebtn" data-act="findings"><span>◇</span>Findings<small>PROPOSED</small></button><div class="side-label">This build</div><button class="sidebtn" data-act="metadata"><span>✓</span>Metadata</button><button class="sidebtn" data-act="storage-stats"><span>◫</span>Storage</button><p>Standalone research.<br>No game installation needed.</p></nav><main class="main"><div class="heading"><div><h1>${concept==='archive'?'Build overview':'Your build. Your next discovery.'}</h1><p class="muted">${concept==='archive'?'Your exact build, preparation status and locally retained content. US download source; matching build metadata advertised in US / EU / KR.':'Start with a question. We’ll fetch the content you need as you go.'}</p></div></div>${notice()}${concept==='archive'?overviewFacts():statCards()}<div class="content"><div>${concept==='researcher'?researchPaths():concept==='catalog'?catalog():archive()}${concept==='researcher'?findings():''}</div><aside class="aside">${concept==='archive'?readiness()+overviewIssues():storagePanel()+readiness()}</aside></div>${concept==='researcher'?'<section class="feature"><div><div class="eyebrow">An exact build is the beginning</div><h2>Want to know what changed?</h2><p>Pick a compatible second build. Explore additions, removals and changes with both sources attached.</p></div><button data-act="changes">Choose comparison build · proposed</button></section>':''}</main></div><footer class="footer"><strong>Design proposal · not a live application.</strong> All counts, sizes, build/source combinations and progress are illustrative; no CDN requests, downloads or persistence occur. Research paths show intended navigation, not current decoder or preview support. Shared objects are stored once. <a href="../build-discovery/index.html?concept=guided&amp;state=ready&amp;product=wow">Back to build discovery concepts</a>.</footer>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));if($('#file-query'))$('#file-query').onchange=()=>modal('Search this build','<p>This proposed search would find catalog file IDs and separately sourced known filenames. It would not silently download or decode every file.</p><p class="muted">This prototype does not run a real search.</p>')}function closeModal(){let focus=lastFocus;$('#overlay').innerHTML='';if(focus&&document.contains(focus))focus.focus()}function modal(title,body,actions=''){lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="overlay"><article class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title">${title}</h2><button id="close-modal" aria-label="Close dialog">✕</button></header>${body}${actions}</article></div>`;$('#close-modal').onclick=closeModal;$('#close-modal').focus();document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{let a=b.dataset.modal;closeModal();if(a==='begin'){retainedOverride=amount();sharedOverride=shared();mode='all';if(content!=='full')content=state==='offline'?'paused':'downloading';paused=content==='paused';render();toast('Preview: background retention started. No real download occurs.')}if(a==='stop'){setMode('ondemand');toast('Preview: download stopped; already retained content stays shared.')}})}function toast(text){$('#message').className='toast';$('#message').textContent=text;setTimeout(()=>{$('#message').textContent='';$('#message').className=''},6000)}function action(a){if(a==='foreground'){foreground=!foreground;render();return}if(a==='home'){render();return}if(a==='switch'){modal('Choose another build','<p>Return to the edition and build browser. Reopening this exact build keeps its saved metadata, shared content and findings.</p><p><a href="../build-discovery/index.html?concept=guided&amp;state=ready&amp;product=wow">Open build discovery concepts →</a></p>');return}if(a==='identity'){modal('Exact build & source details','<p class="muted">Friendly labels help navigation. Raw identities remain available for reproducible research. Values below are illustrative.</p><pre>Edition label: World of Warcraft · Retail\nProduct: wow\nSource channel: Published\nDisplay channel alias: Live\nPreferred download source: us\nMatching metadata advertised in: us, eu, kr\nVersion: 12.1.5.70448\nBuild config: '+ 'a1'.repeat(16)+'\nCDN config: '+ 'd4'.repeat(16)+'\nSource roles: versions + cdns\nLocale/platform view: enUS / Windows</pre><p class="muted">US is the preferred download source, not a separate dataset. This fixture groups matching build metadata advertised in US, EU and KR; their source observations remain separate. Real source details include exact URLs, retrieval times and digests. Build and CDN configuration hashes shown here remain synthetic placeholders.</p>');return}if(a==='catalog-stats'){modal('A catalog entry is not a stored object','<p><strong>1,284,630 file IDs</strong> are visible in this illustrative locale/platform view. ROOT membership variants are counted separately: this example has 1,421,907 variant records. A file may have multiple variants, and multiple entries can refer to the same content. Declared content identities are not verified decoded files.</p><div class="row"><span>Distinct content identities in view</span><b>1,102,840</b></div><p class="tiny">This hypothetical selected scope has a complete FileDataID enumeration; it makes no claim about other locales, platforms or undiscovered variants. Readable filenames may be missing; names from community lists must be identified separately from Blizzard metadata.</p>');return}if(a==='storage-stats'){modal('Understand these sizes','<p><strong>' +(state==='partial'?'Full content size not known':'118.4 GiB estimated full content')+ ':</strong> sum of known encoded lengths, selecting one canonical EKey per distinct CKey in the chosen scope; alternatives and archive container sizes are not added. All selected object lengths are known in this illustrative ready state. Not decoded size, installed size or a guaranteed download.</p><p><strong>'+bytes(amount())+' GiB retained:</strong> physical object bytes already present and referenced by this build. Of that, <strong>'+bytes(shared())+' GiB is shared</strong> with other retained builds; do not add it again.</p><p><strong>'+(state==='partial'?'Unknown additional size':bytes(118.4-amount())+' GiB additional estimate')+':</strong> selected objects not yet retained. Transfer overhead, retries and future decoded indexes are separate.</p><p class="muted">An incomplete size map shows “Not known,” not a fabricated total. Build attribution is not reclaimable disk space; app-wide unique object accounting is separate.</p>');return}if(a==='metadata'||a==='retry'){modal('Build metadata','<p>Configurations and manifests identify the files in this exact build. CDN indexes help locate their stored representations.</p>'+['Build configuration','CDN configuration','Root manifest','Encoding manifest','Install manifest','CDN archive indexes'].map((x,i)=>'<div class="row"><span>'+x+'</span><b class="'+(state==='partial'&&i===5?'unknown':'')+'">'+(state==='partial'&&i===5?'Incomplete':'Retained')+'</b></div>').join('')+'<p class="tiny">This is a proposed metadata summary, not a completeness claim for every WoW format. Content availability, encryption and decoder support are checked separately.</p>'+(state==='partial'?'<div class="actions"><button id="retry-preview" class="primary">Simulate successful retry</button></div>':''));if($('#retry-preview'))$('#retry-preview').onclick=()=>{closeModal();state='ready';render();toast('Preview: metadata ready. No network request occurred.')};return}if(a==='download'){modal('Retain this entire build?','<p>Optional background retention for the selected scope. You can keep mining while it runs.</p><div class="row"><span>Build / region</span><b>12.1.5.70448 / US</b></div><div class="row"><span>Content scope</span><b>enUS · Windows</b></div><div class="row"><span>Estimated additional bytes</span><b>'+(state==='partial'?'Unknown until indexes are ready':bytes(118.4-amount())+' GiB')+'</b></div><p class="tiny">“Entire build” means all content in the explicitly selected scope, not every language/platform variant. Reuses existing objects. Retention does not guarantee decoding; missing or encrypted content is reported separately.</p><div class="notice">This is a design demonstration. No actual free-space check or transfer occurs. Changing language/platform scope would require a new estimate.</div>','<div class="actions"><button data-modal="cancel">Keep on-demand</button><button class="primary" data-modal="begin" '+(state==='partial'?'disabled':'')+'>Simulate background download</button></div>');return}if(a==='pause'){content=content==='paused'?'downloading':'paused';paused=content==='paused';render();return}if(a==='stop'){modal('Stop background download?','<p>Already retained objects remain available and shared. Stopping does not delete content or change another build.</p>','<div class="actions"><button data-modal="cancel">Keep downloading</button><button data-modal="stop">Stop download preview</button></div>');return}const texts={tables:['Explore game data','Browse supported tables, inspect physical records and search admitted fields. Items, spells, quests and collectibles require exact-build schema and relationship support; not every research path is implemented.'],files:['Browse files','Explore file IDs and content identities before fetching individual objects. Known filenames are a separately attributed aid; unnamed files remain searchable by ID.'],assets:['Explore art & sound','Discover potential textures, models and audio. Catalog classification, downloading, decryption and preview support are distinct. This design does not claim working model or sound previews.'],changes:['Choose a comparison build','Select a compatible second build from the s
